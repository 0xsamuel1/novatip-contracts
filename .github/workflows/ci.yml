name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # The Stellar CLI does not ship with the plain-rust CI above, so this job
  # installs a pinned version — deliberately the release line matching the
  # soroban-sdk the contract builds against — and checks that
  # docs/CONTRACT.md's function and error tables match the built interface.
  # Bump STELLAR_VERSION together with a soroban-sdk major.
  docs-check:
    runs-on: ubuntu-latest
    env:
      STELLAR_VERSION: 22.0.0
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Stellar CLI
        run: |
          set -euo pipefail
          curl -sSfL -o stellar-cli.tar.gz \
            "https://github.com/stellar/stellar-cli/releases/download/v${STELLAR_VERSION}/stellar-cli-${STELLAR_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          tar xzf stellar-cli.tar.gz
          install stellar /usr/local/bin/stellar
          stellar --version

      - name: Show toolchain
        run: rustup show

      - name: Add wasm target
        run: rustup target add wasm32-unknown-unknown

      - name: Check CONTRACT.md against the built contract
        run: ./scripts/check-docs.sh

  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # rustup reads rust-toolchain.toml and installs the pinned channel,
      # rustfmt, and clippy automatically.
      - name: Show toolchain
        run: rustup show

      - name: Add wasm target
        run: rustup target add wasm32-unknown-unknown

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml') }}

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

      - name: Build wasm
        run: cargo build --target wasm32-unknown-unknown --release

      # Contract size drives upload cost and ongoing state rent, and it creeps
      # up quietly — a dependency adding a few KB is invisible until someone
      # looks. Printing it on every run (and into the step summary, so it shows
      # on the PR without opening the logs) makes that drift visible.
      - name: Report wasm size
        env:
          # Hard ceiling for the unoptimized release wasm, in bytes.
          #
          # The contract builds to roughly 18 KiB today, so 64 KiB leaves well
          # over 3x headroom: ordinary feature work and a new dependency or two
          # will not trip it, and only a genuine regression — a heavyweight dep
          # pulled in by accident, or `opt-level`/`lto` silently dropping out of
          # the release profile — pushes the artifact past it.
          #
          # This measures the raw `cargo build` output, not the `stellar
          # contract optimize` artifact that actually gets uploaded, so it is a
          # deliberately loose upper bound rather than a cost estimate. If
          # optimization moves into CI, point the check at the optimized file
          # and lower this number to match.
          #
          # Raising it is fine when the growth is understood and intentional —
          # the point is that the bump shows up in a diff and gets a reason.
          MAX_WASM_BYTES: 65536
        run: |
          WASM=target/wasm32-unknown-unknown/release/tip_splitter.wasm
          if [ ! -f "$WASM" ]; then
            echo "error: expected wasm at $WASM but it was not built" >&2
            exit 1
          fi
          SIZE=$(wc -c < "$WASM")
          echo "tip_splitter.wasm: $SIZE bytes ($((SIZE / 1024)) KiB)"
          {
            echo "### Contract size"
            echo
            echo "| Artifact | Bytes | KiB | Limit (bytes) |"
            echo "|----------|------:|----:|--------------:|"
            echo "| \`tip_splitter.wasm\` | $SIZE | $((SIZE / 1024)) | $MAX_WASM_BYTES |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$SIZE" -gt "$MAX_WASM_BYTES" ]; then
            echo
            echo "::error::tip_splitter.wasm is $SIZE bytes, over the $MAX_WASM_BYTES byte limit."
            echo "Shrink the contract, or raise MAX_WASM_BYTES in this workflow with a reason." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
