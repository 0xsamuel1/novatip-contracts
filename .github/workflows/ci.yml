name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # rustup reads rust-toolchain.toml and installs the pinned channel,
      # rustfmt, and clippy automatically.
      - name: Show toolchain
        run: rustup show

      - name: Add wasm target
        run: rustup target add wasm32-unknown-unknown

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml') }}

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

      - name: Build wasm
        run: cargo build --target wasm32-unknown-unknown --release

      # Contract size drives upload cost and ongoing state rent, and it creeps
      # up quietly — a dependency adding a few KB is invisible until someone
      # looks. Printing it on every run (and into the step summary, so it shows
      # on the PR without opening the logs) makes that drift visible.
      # The limit lives in scripts/check-wasm-size.sh, which this step calls —
      # the same script `make ci` runs — so there is exactly one copy of it.
      - name: Report wasm size
        run: ./scripts/check-wasm-size.sh
